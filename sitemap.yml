title: AI @ CSU Fort Collins
domain: https://ai.colostate.edu
status: tentative
scope: Fort Collins campus

principles:
  - Campus-specific tools, teaching, research, training, and support live here.
  - System policy, legal guidance, and risk methodology are linked, not duplicated.
  - Tools are the first navigation task.
  - Getting Started is a homepage call to action rather than a primary navigation item.
  - Governance appears under About and in the footer.

primary_navigation:
  - /tools/
  - /teaching/
  - /research/
  - /training/
  - /it-support/
  - /news/
  - /resources/
  - /about/

utility_navigation:
  - /getting-started/
  - /resources/contact/
  - /about/governance/

external_governance:
  system_ai: https://ai.csusystem.edu/
  data_governance: https://datagov.csusystem.edu/

