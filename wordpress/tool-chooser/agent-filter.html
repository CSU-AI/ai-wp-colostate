<!--
  AI agent directory: filter panel, card styling, and filter script. Paste into ONE Elementor HTML widget
  in the left column of the directory page (see wordpress/agent-directory/README.md).
  Styling matches chooser.css in this folder (same green, gold, panel, and card treatment).
  Needs a container with class "aicsu-agent-results" around the Loop Grid, using the "AI Agent Card" Loop Item.
  Requires a user with unfiltered_html (super admin on the network). This file is the source of truth.

  URL prefilter: ?role=student&platform=copilot&tag=powerpoint,accessibility&q=text (comma separated slugs).
  Groups are built from the terms present on the cards, so new terms appear without editing this file.
-->
<div class="aicsu-agent-filter">
  <details class="aaf-panel" open hidden>
    <summary>Filter Agents</summary>
    <form class="aaf-form" role="search" aria-label="Filter AI agents">
      <p class="aaf-hint">Within a group, agents match any selected option. Across groups, agents must match every group you use.</p>
      <p class="aaf-search">
        <label for="aaf-q">Search Agents</label>
        <input id="aaf-q" type="search" autocomplete="off" placeholder="Name or keyword">
      </p>
      <div class="aaf-groups"></div>
      <p class="aaf-actions"><button type="reset" class="aaf-reset">Reset Filters</button></p>
    </form>
  </details>
</div>
<style>
  .aicsu-agent-filter, .aicsu-agent-results, .aicsu-agent-card { --ac-green: #1e4d2b; --ac-gold: #c8c372; }
  .aicsu-agent-filter [hidden], .aicsu-agent-results [hidden], .aicsu-agent-results .e-loop-item[hidden] { display: none !important; }

  /* Filter panel */
  .aaf-panel { border: 1px solid #c8c8c8; border-top: 5px solid var(--ac-green); border-radius: 4px; background: #f5f5f2; padding: 20px; color: #222; line-height: 1.5; }
  .aaf-panel summary { font-size: 20px; font-weight: 700; color: var(--ac-green); cursor: pointer; min-height: 36px; }
  .aaf-form { margin-top: 12px; }
  .aaf-form p { margin: 0 0 16px; }
  .aaf-hint { color: #4b4b4b; font-size: 14px; }
  .aaf-search label { display: block; font-size: 14px; font-weight: 700; }
  .aaf-search input { display: block; width: 100%; margin-top: 6px; border: 1px solid #777; border-radius: 4px; padding: 12px; color: #222; background: #fff; min-height: 48px; font: inherit; box-sizing: border-box; }
  .aaf-form fieldset { padding: 20px 0; margin: 0; border: 0; border-bottom: 1px solid #ccc; min-width: 0; }
  .aaf-form legend { font-size: 16px; font-weight: 700; padding: 0; margin-bottom: 10px; color: #222; }
  .aaf-form .aaf-options { display: block; }
  .aaf-form label.aaf-opt { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; padding: 6px 0; cursor: pointer; color: #222; }
  .aaf-form input[type=checkbox] { accent-color: var(--ac-green); width: 18px; height: 18px; flex: 0 0 18px; margin: 3px 0 0; }
  .aaf-actions { margin: 20px 0 0; }
  .aaf-reset { background: #fff; color: var(--ac-green); border: 2px solid var(--ac-green); border-radius: 4px; padding: 9px 15px; min-height: 44px; cursor: pointer; font: inherit; line-height: 1.3; }
  .aaf-reset:hover { background: var(--ac-green); color: #fff; }
  .aicsu-agent-filter :is(button, input, summary):focus-visible,
  .aicsu-agent-card a:focus-visible { outline: 3px solid #111; outline-offset: 3px; box-shadow: 0 0 0 5px #fff; }

  /* Layout: let the results column shrink so the grid never overflows it */
  .aicsu-agent-layout { align-items: flex-start; }
  .aicsu-agent-layout > .aicsu-agent-main.e-con { flex: 1 1 0; width: auto; min-width: 0; --width: auto; }
  .aicsu-agent-results, .aicsu-agent-results .elementor-widget-loop-grid { min-width: 0; max-width: 100%; width: 100%; }
  @media (max-width: 767px) { .aicsu-agent-layout > .aicsu-agent-main.e-con, .aicsu-agent-layout > .aicsu-agent-sidebar.e-con { width: 100%; --width: 100%; flex: none; } }
  .aicsu-agent-results .elementor-loop-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1024px) { .aicsu-agent-results .elementor-loop-container { grid-template-columns: 1fr; } }
  .aicsu-agent-main > .elementor-widget-heading .elementor-heading-title { font-size: clamp(24px, 2.5vw, 32px); line-height: 1.2; color: var(--ac-green); margin: 0; }

  /* Result count and empty state */
  .aaf-count { margin: 0 0 16px; font-size: 14px; text-align: right; color: #222; }
  .aaf-empty { background: #f5f5f2; border-left: 4px solid var(--ac-gold); padding: 20px; margin: 0 0 20px; color: #222; }

  /* Agent card (Loop Item "AI Agent Card") */
  .aicsu-agent-results .elementor-loop-container { gap: 20px; }
  .aicsu-agent-results .elementor-loop-container { align-items: stretch; }
  .aicsu-agent-results .e-loop-item { display: flex; flex-direction: column; }
  .aicsu-agent-results .e-loop-item > .aicsu-agent-card { flex: 1 1 auto; }
  /* The CSU theme gives top-level Elementor containers a 4rem bottom margin; loop cards must not inherit it. */
  .aicsu-agent-results .e-loop-item > .aicsu-agent-card.e-con.e-parent { margin: 0 !important; --margin-block-end: 0; }
  .aicsu-agent-card .ac-action { margin-top: auto; }
  .aicsu-agent-card { border: 1px solid #bbb !important; border-top: 4px solid var(--ac-green) !important; border-radius: 5px; background: #fff; color: #222; min-width: 0; }
  .aicsu-agent-card .ac-eyebrow { color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin: 0; }
  .aicsu-agent-card .ac-eyebrow, .aicsu-agent-card .ac-eyebrow * { color: #555; font-size: 12px; margin: 0; }
  .aicsu-agent-card .ac-title .elementor-heading-title { color: var(--ac-green); font-size: 23px; line-height: 1.25; margin: 0; }
  .aicsu-agent-card .ac-summary, .aicsu-agent-card .ac-summary * { color: #222; font-size: 15px; line-height: 1.5; margin: 0; }
  .aicsu-agent-card .ac-audience, .aicsu-agent-card .ac-audience * { color: #222; font-size: 14px; font-weight: 700; }
  .aicsu-agent-card .ac-meta, .aicsu-agent-card .ac-meta * { color: #444; font-size: 14px; margin: 0; }
  .aicsu-agent-card .ac-chips .elementor-post-info__item-prefix { display: none; }
  .aicsu-agent-card .ac-chips ul { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
  .aicsu-agent-card .ac-chips .elementor-icon-list-item { display: block; padding: 0; }
  .aicsu-agent-card .ac-chips .elementor-post-info__terms-list { display: flex; flex-wrap: wrap; row-gap: 6px; font-size: 0; }
  .aicsu-agent-card .ac-chips .elementor-post-info__terms-list-item { font-size: 12px; background: #f1f1e8; color: #333; padding: 4px 8px; border-radius: 3px; margin-right: 6px; }
  .aicsu-agent-card .elementor-button { background: var(--ac-green); color: #fff; border: 2px solid var(--ac-green); border-radius: 4px; padding: 9px 15px; min-height: 44px; line-height: 1.3; font-size: 15px; }
  .aicsu-agent-card .elementor-button:hover { background: #14381f; color: #fff; }
</style>
<script>
(function () {
  function init() {
    var CONFIG = {
      results: '.aicsu-agent-results',
      groups: [
        { param: 'role',     taxonomy: 'aicsu_role',      label: 'Who Are You?' },
        { param: 'platform', taxonomy: 'aicsu_platform',  label: 'Platform' },
        { param: 'tag',      taxonomy: 'aicsu_agent_tag', label: 'Topic' }
      ]
    };

    var root = document.querySelector('.aicsu-agent-filter');
    var panel = root && root.querySelector('.aaf-panel');
    var form = root && root.querySelector('.aaf-form');
    var results = document.querySelector(CONFIG.results);
    var cards = Array.prototype.slice.call(document.querySelectorAll(CONFIG.results + ' .e-loop-item'));
    if (!form || !results || !cards.length) return;

    var search = form.querySelector('#aaf-q');
    var holder = form.querySelector('.aaf-groups');

    var count = document.createElement('p');
    count.className = 'aaf-count';
    count.setAttribute('role', 'status');
    count.setAttribute('aria-live', 'polite');
    var empty = document.createElement('div');
    empty.className = 'aaf-empty';
    empty.hidden = true;
    empty.innerHTML = '<h3>No Matching Agents</h3><p>Remove a filter or reset to see every agent.</p>';
    results.insertBefore(empty, results.firstChild);
    results.insertBefore(count, results.firstChild);

    function slugsOn(card, taxonomy) {
      var prefix = taxonomy + '-', out = [];
      card.classList.forEach(function (c) { if (c.indexOf(prefix) === 0) out.push(c.slice(prefix.length)); });
      return out;
    }

    function params() {
      var p = new URLSearchParams(window.location.search), out = {};
      CONFIG.groups.forEach(function (g) {
        out[g.param] = (p.get(g.param) || '').split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
      });
      out.q = p.get('q') || '';
      return out;
    }

    function nameFor(slug, names) {
      return names[slug] || slug.replace(/-/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
    }

    function build(namesByTax) {
      var initial = params();
      CONFIG.groups.forEach(function (g) {
        var present = {}, names = namesByTax[g.taxonomy];
        cards.forEach(function (card) { slugsOn(card, g.taxonomy).forEach(function (s) { present[s] = true; }); });
        var slugs = Object.keys(present).sort(function (a, b) { return nameFor(a, names).localeCompare(nameFor(b, names)); });
        if (!slugs.length) return;
        var fs = document.createElement('fieldset');
        var legend = document.createElement('legend');
        legend.textContent = g.label;
        var box = document.createElement('div');
        box.className = 'aaf-options';
        fs.appendChild(legend); fs.appendChild(box);
        slugs.forEach(function (slug) {
          var label = document.createElement('label');
          label.className = 'aaf-opt';
          var input = document.createElement('input');
          input.type = 'checkbox'; input.name = g.param; input.value = slug;
          input.checked = initial[g.param].indexOf(slug) !== -1;
          var text = document.createElement('span');
          text.textContent = nameFor(slug, names);
          label.appendChild(input); label.appendChild(text);
          box.appendChild(label);
        });
        holder.appendChild(fs);
      });
      search.value = initial.q;
      panel.hidden = false;
      apply();
    }

    function selected() {
      var out = {};
      CONFIG.groups.forEach(function (g) {
        out[g.param] = Array.prototype.map.call(form.querySelectorAll('input[name="' + g.param + '"]:checked'), function (i) { return i.value; });
      });
      return out;
    }

    function apply() {
      var sel = selected(), q = search.value.trim().toLowerCase(), shown = 0;
      cards.forEach(function (card) {
        var ok = CONFIG.groups.every(function (g) {
          if (!sel[g.param].length) return true;
          var have = slugsOn(card, g.taxonomy);
          return sel[g.param].some(function (s) { return have.indexOf(s) !== -1; });
        });
        if (ok && q) ok = (card.textContent || '').toLowerCase().indexOf(q) !== -1;
        card.hidden = !ok;
        if (ok) shown++;
      });
      empty.hidden = shown !== 0;
      count.textContent = shown + ' of ' + cards.length + (cards.length === 1 ? ' agent' : ' agents');
      var p = new URLSearchParams();
      CONFIG.groups.forEach(function (g) { if (sel[g.param].length) p.set(g.param, sel[g.param].join(',')); });
      if (q) p.set('q', q);
      var qs = p.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    }

    form.addEventListener('change', apply);
    search.addEventListener('input', apply);
    form.addEventListener('reset', function () { window.setTimeout(apply, 0); });
    form.addEventListener('submit', function (e) { e.preventDefault(); });

    // Term display names come from the public REST API; fall back to prettified slugs if it fails.
    var pro = window.ElementorProFrontendConfig, free = window.elementorFrontendConfig;
    var base = (pro && pro.urls && pro.urls.rest) ||
      (free && free.urls && free.urls.ajaxurl && free.urls.ajaxurl.replace(/wp-admin\/admin-ajax\.php.*$/, 'wp-json/')) ||
      '/wp-json/';
    var names = {};
    Promise.all(CONFIG.groups.map(function (g) {
      names[g.taxonomy] = {};
      return fetch(base + 'wp/v2/' + g.taxonomy + '?per_page=100&_fields=slug,name')
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (terms) { terms.forEach(function (t) { names[g.taxonomy][t.slug] = t.name; }); })
        .catch(function () {});
    })).then(function () { build(names); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
